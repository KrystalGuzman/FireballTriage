<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMB3 Co-Op Fireball Triage</title>
  <!-- PeerJS for WebRTC P2P Room Synchronization -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-wrapper {
      position: relative;
      width: 100vw;
      max-width: 640px;
      height: 75vh;
      max-height: 480px;
      border: 3px solid #333;
      background: #000;
      image-rendering: pixelated;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 6px; left: 8px; right: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px #000;
      z-index: 10;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
      text-align: center;
      z-index: 20;
    }
    input, button {
      background: #1c1c1c;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { background: #fff; color: #000; }
    input { width: 120px; text-transform: uppercase; text-align: center; }
    .hidden { display: none !important; }

    /* Touch Controls (Mobile Viewport) */
    #touch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100vw;
      max-width: 640px;
      height: 25vh;
      max-height: 140px;
      padding: 10px 24px;
      background: #111;
      border-top: 2px solid #222;
    }
    .touch-btn-group { display: flex; gap: 14px; }
    .t-btn {
      width: 68px;
      height: 68px;
      background: #2a2a2a;
      border: 2px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      touch-action: none;
    }
    .t-btn:active, .t-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .t-btn-jump {
      width: 80px;
      height: 80px;
      background: #900;
      border-color: #f33;
      font-size: 16px;
    }
    .t-btn-jump:active, .t-btn-jump.active {
      background: #f33;
      color: #fff;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <div class="hud">
    <div>TIME: <span id="hud-time" style="color: #4af;">00:00.00</span></div>
    <div>CLOCK: <span id="hud-rate" style="color: #ff4;">100%</span></div>
    <div>SCORE: <span id="hud-score" style="color: #fa0;">
